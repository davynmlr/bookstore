spring.application.name=bookstore
spring.h2.console.enabled=true
 
# verkkoselaimessa käytettävä tietkannan GUI
# spring.h2.console.path=/h2-console
# spring.datasource.url=jdbc:h2:mem:testdb
spring.jpa.show-sql=true
 
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/davynm?useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=davynm
spring.datasource.password=password
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=create
# pilvessä käytetty portti
spring.data.rest.base-path=/api
 
# errorpage
# spring.web.error.whitelabel.enabled =false
 
server.ssl.enabled=false
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tomcat
server.ssl.key-store=${SERVER_SSL_KEY_STORE:file:./springboot-example.p12}
server.ssl.key-store-password=changeit